<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso privado | GETS</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 10% 12%,#f0dfce 0,transparent 42%),radial-gradient(ellipse at 90% 95%,#ead6c1 0,transparent 40%),#faf7f2;color:#4b342a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:20px;border:1px solid #a9825930;pointer-events:none}
.panel{width:min(100%,460px);padding:44px 42px 35px;background:#fffdfb;border:1px solid #e8ded3;border-radius:24px;box-shadow:0 24px 70px #6b42201a;text-align:center;position:relative}
.emblem{display:grid;place-items:center;margin:0 auto 24px;width:82px;height:82px;border:1px solid #d9bd9d;border-radius:50%;background:#fbf3e8;color:#854f32;font:600 25px Georgia,serif;letter-spacing:1px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;color:#ad835d;margin-bottom:14px}
h1{font:normal clamp(30px,5vw,38px)/1.18 Georgia,"Times New Roman",serif;margin:0 0 15px}
p{font-size:14px;color:#85766a;line-height:1.75;margin:0 0 32px}
form{text-align:left}label{display:block;font-size:13px;font-weight:650;margin-bottom:10px}
.field{position:relative}input{width:100%;height:53px;border:1px solid #d9cbbf;background:#fff;border-radius:12px;padding:0 48px 0 17px;font-size:16px;color:#4b342a;outline:none}input:focus{border-color:#965c3e;box-shadow:0 0 0 3px #965c3e17}
.toggle{position:absolute;right:8px;top:7px;width:40px;height:40px;border:0;background:transparent;color:#9b806b;cursor:pointer;font-size:20px}
.submit{display:block;width:100%;height:53px;margin-top:19px;border:0;border-radius:12px;background:#874d31;color:white;font-size:15px;font-weight:650;cursor:pointer;transition:background .2s}.submit:hover{background:#6c3922}.submit:disabled{opacity:.65;cursor:wait}
.error{color:#a32c2c;font-size:13px;min-height:20px;margin-top:12px;text-align:center}
footer{margin-top:27px;padding-top:22px;border-top:1px solid #eee6df;font-size:12px;color:#aa9788}
@media(max-width:480px){.panel{padding:34px 24px 28px}body:before{inset:9px}}
</style>
</head>
<body>
<main class="panel">
<div class="emblem">GETS</div>
<div class="eyebrow">GRUPO EDUCATIVO TERESIANO SANJUANISTA</div>
<h1>Bienvenidos a GETS</h1>
<p>Un espacio de encuentro, formación y espiritualidad.<br>Ingresa la clave que te compartieron para continuar.</p>
<form id="form">
<label for="password">Clave de acceso</label>
<div class="field"><input id="password" type="password" placeholder="Escribe tu clave" autocomplete="current-password" required autofocus><button class="toggle" type="button" id="toggle" aria-label="Mostrar contraseña">◉</button></div>
<button class="submit" id="submit" type="submit">Entrar al sitio</button>
<div class="error" id="error" role="alert" aria-live="polite"></div>
</form>
<footer>Acceso reservado · GETS</footer>
</main>
<script>
const form=document.getElementById('form'),input=document.getElementById('password'),button=document.getElementById('submit'),error=document.getElementById('error');
document.getElementById('toggle').addEventListener('click',()=>{input.type=input.type==='password'?'text':'password'});
form.addEventListener('submit',async e=>{
e.preventDefault();error.textContent='';button.disabled=true;button.textContent='Verificando acceso…';
try{
const response=await fetch('/api/gets-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value}),cache:'no-store'});
const data=await response.json();
if(!response.ok)throw new Error(data.error||'No fue posible ingresar');
window.location.replace('/');
}catch(err){error.textContent=err.message||'Error de conexión';input.value='';input.focus()}
finally{button.disabled=false;button.textContent='Entrar al sitio'}
});
</script>
</body></html>
